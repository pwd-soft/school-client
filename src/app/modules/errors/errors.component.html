<div
  class="
    d-flex
    flex-column flex-column-fluid
    bgi-position-y-bottom
    position-x-center
    bgi-no-repeat bgi-size-contain bgi-attachment-fixed
  "
  [style.background-image]="
    'url(./assets/media/illustrations/sketchy-1/14.png)'
  "
>
  <div class="d-flex flex-column flex-column-fluid text-center p-10 py-lg-20">
    <a (click)="routeToDashboard()" class="mb-10 pt-lg-20 cursor-pointer">
      <!-- <img
        alt="Logo"
        src="./assets/media/logos/logo-1.svg"
        class="h-50px mb-5"
      /> -->
      <img src="./assets/media/logos/objection-logo-2.png" class="max-h-120px" alt="Logo" />
    </a>
    <div class="pt-lg-10">
      <router-outlet></router-outlet>

      <div class="text-center" *ngIf="showDashboardButton">
        <a
          (click)="routeToDashboard()"
          class="btn btn-lg btn-primary fw-bolder cursor-pointer"
        >
          Go to Dashboard
        </a>
      </div>
      <div class="text-center" *ngIf="!showDashboardButton">
        <a class="btn btn-lg btn-primary fw-bolder cursor-pointer"
        (click)="logout()"
        >
        <i class="fas fa-sign-out-alt"></i> Sign Out
        </a>
      </div>
    </div>
  </div>

  <div class="d-flex flex-center flex-column-auto p-10">
    <div class="d-flex align-items-center fw-bold fs-6">
      <a
        href="https://keenthemes.com"
        class="text-muted text-hover-primary px-2"
      >
        About
      </a>
      <a
        href="mailto:support@keenthemes.com"
        class="text-muted text-hover-primary px-2"
      >
        Contact
      </a>
      <a
        href="https://1.envato.market/EA4JP"
        class="text-muted text-hover-primary px-2"
      >
        Contact Us
      </a>
    </div>
  </div>
</div>
